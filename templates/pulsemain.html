<script>
    var ranking = false;
    async function getData() {
        // Nexus
        const response = await fetch(`{{url_for('getNextMatch')}}`);
        let data = await response.json();
        document.getElementById("match").innerHTML = data["nextMatch"]
        document.getElementById("match").style.color = data["bumperColor"]
        qt = document.getElementById("queuetime")
        qt.innerHTML = data["queueTime"]
        qt.style.color = data["color"]
        document.getElementById("popup").innerHTML = document.getElementById("queue").innerHTML
        document.getElementById('hidden').innerHTML = data["hidden"]

        let ann = data["announcements"]
        let html = "<h1 id='title'>Announcements</h1>"
        for (let i = 0; i < ann.length; i++) {
            if (ann[i]["announcement"] == "") break;
            html += '<div class="card"><h4 class="team">'+ann[i]["requestedByTeam"]+'</h4><h2 class="announcement">'+ann[i]["announcement"]+'</h2><h4 class="time">'+ann[i]["time"]+'</h4></div>'
            if (ann[i]["announcement"] == "No More Announcements") break;
        }
        document.getElementById("announcements").innerHTML = html

        if (!ranking) await getTBAData()
        else await getRanking()
        await getDriveTeamData()

        html = "<h1 id='title'>Status</h1>"

        // }
        html += data["tasks"]
        document.getElementById("tasks").innerHTML = html

    }

    async function getTBAData() {
        const response = await fetch(`{{url_for('tbadata')}}`);
        let data = await response.json();
        // console.log(data)
        html = ""
        type = "future"
        matches = data[type]
        console.log(matches)
        if (matches && matches.length > 1) {
            for (let i = 0; i < matches.length; i++) {
                // console.log(matches[i])
                html += matches[i]
                html += "<br>"
            }
        }
        else {
            html = "<h2 style='font-size: 5rem;'>No more matches!</h2>"
        }
        document.getElementById("schedule").innerHTML = html
    }

    async function getRanking() {
        const response = await fetch(`{{url_for('getRanking')}}`);
        let data = await response.json();
        let html = ""
        if (data && data.length > 1) {
            for (let i = 0; i < data.length; i++) {
                // console.log(data[i])
                html += data[i]
                html += "<br>"
            }
        }
        else {
            html = "<h2 style='font-size: 5rem;'>No rankings rn :3</h2>"
        }
        document.getElementById("schedule").innerHTML = html
    }

    var popupCount = 0
    async function getDriveTeamData() {
        const response = await fetch(`{{url_for('getDriveTeam')}}`);
        let data = await response.json();
        if (data["msg"] != "") {
            popupCount = 0
            let popup = document.getElementById("popup")
            popup.innerHTML = data["msg"]

        }
        wait10s()
